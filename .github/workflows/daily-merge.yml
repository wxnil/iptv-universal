name: 每日同步通用M3U
on:
  schedule:
    # 每天北京时间 6:00 自动同步（UTC 22:00）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 支持手动立即运行

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行合并脚本
        run: python merge.py

      - name: 提交更新到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add universal.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "每日自动同步更新" && git push)
